name: ci
on: [pull_request, push]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks needs full history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-smoke:   # activated once the gold set exists; stub for now
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "eval gate lands with the gold set (build phase)"

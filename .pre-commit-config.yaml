# Pre-commit: repo-level enforcement that travels with the code.
# Install once:  uv run pre-commit install
# Run on all:    uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # corpus/raw/ holds the tracked corpus payloads and evals/reports/ holds committed
      # raw eval output. Both are EVIDENCE, and both are verified by hash: ingest re-hashes
      # every payload against corpus/raw/manifest.json and refuses a mismatch. A hook that
      # helpfully strips a trailing space from a regulator's extracted text would change its
      # sha256 and break ingestion with a message about the file having been tampered with.
      # Formatting must never touch bytes whose hash is part of the measurement.
      - id: trailing-whitespace
        exclude: ^(corpus/raw/|evals/reports/)
      - id: end-of-file-fixer
        exclude: ^(corpus/raw/|evals/reports/)
      - id: check-added-large-files
        args: ["--maxkb=5120"]          # 5 MB
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        # Vite emits tsconfig files as JSONC (comments are legal there); check-json cannot parse
        # them. Excluded rather than stripping comments from generated config.
        exclude: ^ui/tsconfig.*\.json$
      - id: detect-private-key
      # Added after a sandbox snapshot stripped the executable bit from all 16 shebang scripts and
      # the loss was committed unnoticed. That silently disabled .claude/hooks/dangerous-bash.sh  -
      # the agent command denylist (SECURITY.md S-16)  -  and failed V8 of the verification matrix.
      # A file-mode regression is invisible in a diff; this hook makes it impossible to commit.
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # gitleaks as a local hook: the project pins the binary (installed in Phase 0) rather than
  # letting pre-commit fetch a toolchain at hook-install time. Secret scanning must not depend
  # on a network fetch succeeding.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy (app)
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false

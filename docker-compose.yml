services:
  db:
    # Pinned to the exact pairing every published number was measured on: PostgreSQL 18.6
    # with pgvector 0.8.6 on Debian trixie. This must stay identical to
    # scripts/dev_db_native.sh and the eval-gate job in .github/workflows/ci.yml --
    # tests/test_config_coherence.py fails the build if the three drift apart.
    #
    # It previously pinned 0.8.2-pg18 while both other paths installed 0.8.6, so a reviewer
    # following this file got a different extension version than the baselines were measured
    # on. A bare `pg18` tag is wrong for the same reason in slower motion: it lets the
    # extension version move underneath the baselines without any file in this repo changing.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: docscout_db
    environment:
      POSTGRES_DB: docscout
      POSTGRES_USER: docscout
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      # DEVIATION FROM BRIEF §4: pg18 images store data in major-version subdirs and require
      # the mount at /var/lib/postgresql (NOT /var/lib/postgresql/data). The brief's path
      # makes the container exit(1) on boot. See docker-library/postgres#1259. Recorded in
      # SETUP_REPORT.
      - pgdata:/var/lib/postgresql
      # The same initdb scripts scripts/dev_db_native.sh executes, so the two provisioning
      # paths cannot diverge in what they create.
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docscout -d docscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runnable API service (P0-4). Built from `Dockerfile` (pinned base digest,
  # `uv sync --frozen`, non-root, HEALTHCHECK, no secret in layers). Shares the
  # same `db` + `infra/initdb/` contract as every other provisioning path, so
  # `tests/test_config_coherence.py` still guards the triple-pin.
  #
  # DATABASE_URL is overridden here because `.env` names `localhost` for native
  # runs; inside the compose network the host is `db`. Passwords still come
  # from `.env` (never committed, never baked into the image).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docscout-api:local
    container_name: docscout_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://docscout_app:${DB_APP_PASSWORD:?set in .env}@db:5432/docscout
      DOCSCOUT_API_KEY: ${DOCSCOUT_API_KEY:?set in .env}
      DOCSCOUT_RATE_LIMIT_PER_MINUTE: ${DOCSCOUT_RATE_LIMIT_PER_MINUTE:-60}
      DOCSCOUT_LOG_JSON: ${DOCSCOUT_LOG_JSON:-1}
      HF_HOME: /opt/hf-cache
    ports: ["8000:8000"]
    volumes:
      - hf-cache:/opt/hf-cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  hf-cache:

# There is deliberately no Redis service. `REDIS_URL` appears in .env.example because a
# multi-worker deployment would need it for the result cache and the rate limiter, but
# nothing in app/ connects to it today -- both live in-process, and /healthz reports
# `single_process: true` so that limitation is visible rather than assumed. Starting a
# container nothing talks to is scaffolding presented as architecture.

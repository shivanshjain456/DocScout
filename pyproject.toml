[project]
name = "docscout"
version = "0.1.0"
description = "Production RAG service over the RBI/SEBI regulatory corpus (hybrid retrieval + reranking + citation-grounded answers)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "deepeval>=4.2.7",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-community>=0.3,<0.4",
    "mypy>=2.3.1",
    "openai>=2.0,<3.0",
    "orjson>=3.12.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.23.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "sentence-transformers>=6.1.0",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "trafilatura>=2.2.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

# Torch must resolve to the CPU-only build: this box is 2 vCPU / 1.9 GiB RAM with no GPU,
# and the default PyPI wheel drags in multi-GB CUDA runtimes. Recorded in SETUP_REPORT §4.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
# mutmut writes a mutated copy of the package here. It is generated output, deliberately
# contains broken code, and is removed by `make mutation-clean`.
extend-exclude = ["mutants"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test.
# S603/S607: tests/test_git_history.py drives a shell script through subprocess, which is
# the only way to test a shell script. Every argument is a literal or a pytest tmp_path,
# and resolving git and bash by absolute path would make the suite fail on any machine
# whose layout differs. Scoped to tests only -- app/** keeps the full rule set.
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S101", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `slow` marks the tests that load the cross-encoder and score real corpus chunks: ~11 s to
# load the weights and ~100 ms per pair on 2 vCPU. They run by default, because a reranker
# that is only tested through stubs is a reranker nobody has checked end to end. Skip them
# during a tight edit loop with `-m "not slow"`.
markers = [
    "slow: loads a model or scores real corpus chunks (seconds, not milliseconds)",
]

[dependency-groups]
dev = [
    "mutmut>=3.2",
]

[tool.mutmut]
# Mutation testing is scoped to the two measurement instruments, not the whole codebase.
#
# Research consensus is that a coverage percentage is a weak quality signal -- it measures
# execution, not validation -- while a mutation score cannot be gamed by a test that runs
# code without asserting anything. That matters most where a silent error would be
# invisible: scorers.py and stats.py produce every number this project publishes, so a
# wrong comparison there corrupts the README, the baselines and the regression gate at
# once, and no downstream test would notice.
#
# Mutation testing is compute-heavy, so it runs against the two fast, database-free suites
# that exercise these modules rather than the whole suite.
source_paths = ["app/evals/scorers.py", "app/evals/stats.py"]
# Only the suites that exercise these two modules. mutmut copies the mutated package into
# a `mutants/` tree, so collecting the whole suite fails on modules it did not copy -- and
# running a database-backed suite against a pure-arithmetic mutant would cost minutes per
# mutant for no extra signal.
# tests_dir makes mutmut copy the suite into its sandbox so pytest runs *there*, against
# the mutated sources. Without it the runner executes from the repository root, imports the
# original unmutated module, and every mutant trivially "survives" -- a 0% score that looks
# like a catastrophic result and is actually a misconfiguration.
tests_dir = ["tests"]
# The whole package is copied into the sandbox so the suite can be *collected* there: the
# stats phase imports every test module, and the ones touching app.api or app.evals.gate
# would fail on modules mutmut does not mutate. Safe because mutmut copies these files
# before generating mutants, so the mutated scorers.py and stats.py overwrite the copies.
also_copy = ["app", "evals/gold"]  # gold set: test_goldset.py loads it at collection time
# Applied to every pytest invocation, including mutmut's stats phase, which runs the whole
# suite rather than the selection below. These three suites assert against repository
# files outside app/ -- shell scripts, compose and CI manifests, the docs tree -- which the
# sandbox deliberately does not contain. They are unrelated to the mutated modules.
pytest_add_cli_args = [
    "--ignore=tests/test_git_history.py",
    "--ignore=tests/test_config_coherence.py",
    "--ignore=tests/test_rescope.py",
    "--ignore=tests/test_goldset.py",
    "--ignore=tests/test_ingest.py",
]
# tests/test_scorers.py exercises both target modules directly and imports nothing else
# from the package. That matters because mutmut copies only the mutated sources: a suite
# importing app.evals.gate or app.api cannot even be collected inside the sandbox.
pytest_add_cli_args_test_selection = ["tests/test_scorers.py"]
